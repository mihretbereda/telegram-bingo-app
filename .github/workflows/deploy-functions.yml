name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy all edge functions
        run: |
          npx supabase functions deploy ghost-join --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy game-runner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy setup-ghosts --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy reserve-cartela --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy init-sessions --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy admin-toggle --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy house-earnings --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
